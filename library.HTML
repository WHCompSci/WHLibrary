<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Find Your Shelf</title>

  <style>
    /* ============================================================
       DESIGN TOKENS
       ============================================================ */
    :root {
      --ink:  #3a2413;  /* main text color */
      --gold: #ffcf40;  /* glow highlight border */
      --glow: #ffb020;  /* glow highlight shadow */
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      background: #241609;
      font-family: Georgia, serif;
      color: var(--ink);
    }

    body {
      /* keep content clear of notches / home indicators on mobile */
      padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0) 0;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 14px 34px;
    }


    /* ============================================================
       HEADER
       ============================================================ */
    header {
      text-align: center;
      color: #f3e6c8;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 1.35rem;
      margin: 0 0 4px;
    }

    header p {
      margin: 0;
      color: #cbb488;
      font-size: .88rem;
    }


    /* ============================================================
       SEARCH BAR + SUGGESTION CHIPS + STATUS MESSAGE
       ============================================================ */
    .searchbar {
      display: flex;
      gap: 8px;
      max-width: 480px;
      margin: 14px auto 8px;
    }

    #q {
      flex: 1;
      padding: 10px 12px;
      font-size: 1rem;
      border-radius: 7px;
      border: 2px solid #8a5f3a;
      background: #fbf3e0;
      color: var(--ink);
      font-family: inherit;
    }

    #go {
      padding: 10px 18px;
      border: none;
      border-radius: 7px;
      background: #8a5f3a;
      color: #fff8ea;
      cursor: pointer;
      font-family: inherit;
    }

    #go:hover {
      background: #6b4a2e;
    }

    #q:focus,
    #go:focus-visible,
    .chip:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: center;
      max-width: 560px;
      margin: 0 auto 8px;
    }

    .chip {
      background: #4a3218;
      color: #e9d3a8;
      border: 1px solid #6b4a2e;
      border-radius: 12px;
      padding: 2px 9px;
      font-size: .72rem;
      cursor: pointer;
    }

    .chip:hover {
      background: #6b4a2e;
    }

    #status {
      text-align: center;
      min-height: 1.4em;
      margin: 0 auto 12px;
      max-width: 640px;
      font-size: .92rem;
      color: #f3e6c8;
    }

    #status.notfound {
      color: #e8a37b;
    }

    #status.found b {
      color: var(--gold);
    }

    /* ============================================================
       HOTSPOTS
       Invisible rectangles positioned on top of the real shelves.
       .hot        = normal, invisible, non-interactive placeholder
       .hot.glow   = the "lit up" state toggled on by JavaScript
       ============================================================ */
    .hot {
      position: absolute;
      background: transparent;
      transform-origin: 0% 100%;  /* rotated shelves pivot from bottom-left corner */

    }

    .hot.glow {
      background: rgba(255, 207, 64, .28);
      border-radius: 2px;
      box-shadow:
        0 0 6px 3px var(--glow),
        0 0 22px 9px rgba(255, 176, 32, .9);
      animation: pulse 1.1s ease-in-out infinite alternate;
      z-index: 5;
    }

    @keyframes pulse {
      from {
        box-shadow:
          0 0 6px 3px var(--glow),
          0 0 16px 6px rgba(255, 176, 32, .7);
      }
      to {
        box-shadow:
          0 0 10px 5px var(--glow),
          0 0 26px 11px rgba(255, 176, 32, 1);

<script>
  /* ==============================================================
     TOKENIZE + COMPARE
     Splits a code into alternating letter / number chunks so we
     can compare things like "R220" against "R80" and "R364", or
     "BIO Nelson" against "BIO Lee" and "BIO Rog", the same way.
       tok("R220")     -> ["R", "220"]
       tok("BIO LAN")  -> ["BIO", "LAN"]
     ============================================================== */
  function tok(s) {
    return (s || '').toUpperCase().match(/[A-Z]+|\d+\.?\d*/g) || [];
  }

  function cmp(a, b) {
    const A = tok(a);
    const B = tok(b);
    const n = Math.max(A.length, B.length);

    for (let i = 0; i < n; i++) {
      const x = A[i];
      const y = B[i];

      if (x === undefined) return -1;
      if (y === undefined) return 1;

      const xIsNumber = /^\d/.test(x);
      const yIsNumber = /^\d/.test(y);

      if (xIsNumber && yIsNumber) {
        const diff = parseFloat(x) - parseFloat(y);
        if (diff) return diff < 0 ? -1 : 1;
      } else {
        const diff = x.localeCompare(y);
        if (diff) return diff;
      }
    }
    return 0;
  }


  /* ==============================================================
     SEARCH
     ============================================================== */
  const shelves = [...document.querySelectorAll('.hot[data-type]')];
  const statusEl = document.getElementById('status');
  const inputEl  = document.getElementById('q');

  function search(raw) {
    const q = (raw || '').trim();

    // clear any previous glow before evaluating the new query
    shelves.forEach(s => s.classList.remove('glow'));

    if (!q) {
      statusEl.className = '';
      statusEl.textContent = '';
      return;
    }

    const ql = q.toLowerCase();

    let matches = shelves.filter(s => {
      if (s.dataset.type === 'topic') {
        const key = s.dataset.key;
        return key.includes(ql) || ql.includes(key);
      }
      // range: query must fall between low and high (inclusive)
      return cmp(q, s.dataset.low) >= 0 && cmp(q, s.dataset.high) <= 0;
    });

    if (matches.length === 0) {
      statusEl.className = 'notfound';
      statusEl.textContent = `No shelf matches "${q}". Check the code and try again, or ask the desk.`;
      return;
    }

    matches.forEach(s => s.classList.add('glow'));
    matches[0].scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });

    statusEl.className = 'found';
    statusEl.innerHTML = matches.length === 1
      ? 'Found it — glowing on the map.'
      : `${matches.length} shelves match "${q}" — all glowing on the map.`;
  }


  /* ==============================================================
     EVENTS
     ============================================================== */
  document.getElementById('go').addEventListener('click', () => search(inputEl.value));

  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') search(inputEl.value);
  });

  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      inputEl.value = chip.textContent;
      search(chip.textContent);
    });
  });
</script>
